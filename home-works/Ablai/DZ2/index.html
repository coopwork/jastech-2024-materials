<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Website</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/a076d05399.js"></script> <!-- For social icons -->
</head>

<body>
    <!-- Header section with logo and burger menu -->
    <header class="header">
        <a href="#">
            <img src="logo.png" alt="logo" class="logo" />
        </a>

        <!-- Burger menu button -->
        <button class="burger-menu" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Navigation menu -->
        <nav class="nav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#sport-news">Sport</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main content -->
    <section class="section">
        <div class="news" id="sport-news">
            <div class="title">
                <h3><a href="#">Sport News</a></h3>
            </div>
        </div>
    </section>

    <!-- Footer section -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-logo">
                <img src="logo.png" alt="Sports News" />
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
